function resize(){
  const h = Math.min(innerHeight, innerWidth*16/9);
  const w = h*9/16;
  renderer.setSize(w,h,false);
  canvas.style.width = w+'px'; canvas.style.height = h+'px';
  canvas.style.left = ((innerWidth-w)/2)+'px';

const mat   = c => new THREE.MeshLambertMaterial({color:c});
const basic = c => new THREE.MeshBasicMaterial({color:c});
function add(m,p){ (p||scene).add(m); return m; }
function box(w,h,d,c,x,y,z,p){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c)); m.position.set(x,y,z); return add(m,p); }
function cyl(rt,rb,h,c,x,y,z,p,seg=10){ const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat(c)); m.position.set(x,y,z); return add(m,p); }
function sph(r,c,x,y,z,p,seg=10){ const m=new THREE.Mesh(new THREE.SphereGeometry(r,seg,Math.max(6,Math.round(seg*0.7))),mat(c)); m.position.set(x,y,z); return add(m,p); }
function plane(w,h,material,x,y,z,ry=0){ const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),material); m.position.set(x,y,z); m.rotation.y=ry; return add(m); }

// Yer: bog'

// ===== Gullar va butalar =====
const FLOWER_COLS = [0xd62828,0xff6fa3,0xffffff,0xffd23f,0x9b5de5,0xff8c42];
function flowerBed(cx,cz,w,d){
  box(w+0.4,0.25,d+0.4,0x7b5b3a,cx,0.12,cz);
  for(let i=0;i<6;i++) for(let j=0;j<4;j++){

}

    sph(0.17,col,x+Math.cos(a)*0.45,0.85+(k%2)*0.2,z+Math.sin(a)*0.45,null,8);
  }
}

function chair(x,z,ry,c=0x6fbf73){

// ===== CHARXPALAK (o'ngda) =====
const WX=22, WY=18, WZ=-22, R=16;
const BENCH_Z = -15;

// Stollar ro'yxati (skameyka ham kiradi)
const TABLES = [
  {x:-34, z:1,  c:0xffd400, cam:[-30,2.3,7], look:[-30,3.2,-9.5]},
  {x:-26, z:-4, c:0xe30613, cam:[-30,2.3,7], look:[-30,3.2,-9.5]},

  {x:WX,  z:BENCH_Z, c:0x8b5a2b, cam:[WX,2.0,BENCH_Z+3.5], look:[WX,1.45,BENCH_Z], bench:true},

  }
  t.seats.forEach(s=>{ s.ry = Math.atan2(t.x-s.x, t.z-s.z); if(!t.bench) chair(s.x,s.z,s.ry); });
});
// Telefon (skameyka oldida, suratlar bilan)

plane(0.5,0.9,basic(0x000000),WX,1.35,BENCH_Z+0.05);

// Charxpalak

wheel.position.set(WX,WY,WZ); scene.add(wheel);

wheel.add(ring);

const CABC=[0xff6b8b,0xffd166,0x06d6a0,0x4cc9f0,0xf72585,0xffbe0b,0x8ecae6,0xe76f51,0xff9f1c,0x2ec4b6,0xffffff,0xb388eb];

// ===== Insonlar =====
const SKIN = 0xe8b896;
function human(isGirl, faceUrl){
  const root = new THREE.Group(); scene.add(root);
  const torso = new THREE.Group(); torso.position.y = 1.0; root.add(torso);
  const cloth = isGirl ? 0x0a0a0a : 0x2b2f3a;
  box(0.7,0.9,0.4,cloth,0,0.45,0,torso);
  if(!isGirl){
    box(0.22,0.7,0.02,0xffffff,0,0.45,0.21,torso);   // oq ko'ylak
    box(0.08,0.5,0.03,0x7a1f1f,0,0.4,0.23,torso);    // galstuk
  } else {
    cyl(0.25,0.5,1.0,0x0a0a0a,0,-0.5,0,torso,12);    // qora ko'ylak (yubka)
  }
  const legs = [];
  for(const sx of [-0.18,0.18]){
    const lg = new THREE.Group(); lg.position.set(sx,1.0,0); root.add(lg);
    box(0.26,0.95,0.28,isGirl?0x222222:0x1a1d24,0,-0.47,0,lg);
    legs.push(lg);
  }
  const arms = [];
  for(const sx of [-0.5,0.5]){
    const ag = new THREE.Group(); ag.position.set(sx,0.8,0); torso.add(ag);
    box(0.22,0.8,0.22,cloth,0,-0.4,0,ag);
    sph(0.12,SKIN,0,-0.85,0,ag,8);
    arms.push(ag);
  }
  const head = new THREE.Group(); head.position.set(0,1.15,0); torso.add(head);
  sph(0.3,SKIN,0,0,0,head,14);
  const hairC = isGirl ? 0x5a3424 : 0x1a1410;
  const hair = new THREE.Mesh(new THREE.SphereGeometry(0.33,14,10,0,Math.PI*2,0,Math.PI*0.55), mat(hairC));
  hair.position.set(0,0.05,0); head.add(hair);
  if(isGirl) box(0.55,0.75,0.25,hairC,0,-0.2,-0.18,head);
  if(faceUrl){
    const f = new THREE.Mesh(new THREE.PlaneGeometry(0.46,0.56), new THREE.MeshBasicMaterial({transparent:true}));
    f.position.set(0,-0.02,0.31); head.add(f);
    new THREE.TextureLoader().load(faceUrl, t=>{ f.material.map=t; f.material.needsUpdate=true; });
  }
  return {root,torso,legs,arms,head};
}
const boy  = human(false, FACE_BOY);
const girl = human(true,  FACE_GIRL);
boy.root.position.set(4,0,2);
girl.root.position.set(5,0,2);

function pose(h,t,moving,sit){
  if(sit){
    h.legs.forEach(l=>l.rotation.x=-1.5);
    h.arms.forEach(a=>a.rotation.x=-0.5);
    h.torso.rotation.x = 0.05;
    h.torso.position.y = 1.0;
    return;
  }
  h.torso.rotation.x = 0;
  const sw = moving ? Math.sin(t*7)*0.6 : 0;
  h.legs[0].rotation.x = sw;  h.legs[1].rotation.x = -sw;
  h.arms[0].rotation.x = -sw*0.8; h.arms[1].rotation.x = sw*0.8;
  h.torso.position.y = 1.0 + Math.sin(t*2)*0.012; // nafas olish
}

// ===== Boshqaruv: joystik, klaviatura, aylantirish =====
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
let jx=0, jy=0, jOn=false;
function joyMove(e){
  const t = e.touches ? e.touches[0] : e;
  const r = joy.getBoundingClientRect();
  const cx=r.left+r.width/2, cy=r.top+r.height/2, max=r.width/2-28;
  let dx=t.clientX-cx, dy=t.clientY-cy;
  const d=Math.hypot(dx,dy);
  if(d>max){ dx=dx/d*max; dy=dy/d*max; }
  knob.style.transform=`translate(${dx}px,${dy}px)`;
  jx=dx/max; jy=dy/max;   // yuqoriga surilsa jy manfiy
}
joy.addEventListener('touchstart', e=>{ jOn=true; joyMove(e); e.preventDefault(); }, {passive:false});
joy.addEventListener('touchmove',  e=>{ if(jOn) joyMove(e); e.preventDefault(); }, {passive:false});
const joyEnd=()=>{ jOn=false; jx=jy=0; knob.style.transform='translate(0,0)'; };
joy.addEventListener('touchend', joyEnd);
joy.addEventListener('touchcancel', joyEnd);

let yaw=0, pitch=0.35;
let dragging=false, lx=0, ly=0;
canvas.addEventListener('pointerdown', e=>{ dragging=true; lx=e.clientX; ly=e.clientY; });
addEventListener('pointermove', e=>{
  if(!dragging) return;
  yaw -= (e.clientX-lx)*0.008;
  pitch = THREE.MathUtils.clamp(pitch+(e.clientY-ly)*0.004, 0.08, 0.9);
  lx=e.clientX; ly=e.clientY;
});
addEventListener('pointerup', ()=> dragging=false);
addEventListener('pointercancel', ()=> dragging=false);

const keys={};
addEventListener('keydown', e=>keys[e.key.toLowerCase()]=true);
addEventListener('keyup',   e=>keys[e.key.toLowerCase()]=false);

// ===== Harakat va to'siqlar =====
function inside(x,z){ return x>B.x0 && x<B.x1 && z>B.z0 && z<B.z1; }
function canStep(ax,az,bx,bz){
  if(inside(ax,az)===inside(bx,bz)) return true;
  return bx>DOOR.x0 && bx<DOOR.x1 && Math.abs(bz-B.z1)<1.5;
}
function moveBoy(ox,oz){
  const p = boy.root.position;
  const x0=p.x, z0=p.z;
  let nx=x0+ox, nz=z0+oz;
  if(!canStep(x0,z0,nx,z0)) nx=x0;
  if(!canStep(nx,z0,nx,nz)) nz=z0;
  const r=Math.hypot(nx,nz); if(r>54){ nx*=54/r; nz*=54/r; }
  p.x=nx; p.z=nz;
}
function walk(dt){
  let mx=jx, my=-jy;
  if(keys['w']||keys['arrowup'])    my+=1;
  if(keys['s']||keys['arrowdown'])  my-=1;
  if(keys['a']||keys['arrowleft'])  mx-=1;
  if(keys['d']||keys['arrowright']) mx+=1;
  const L=Math.hypot(mx,my); if(L>1){ mx/=L; my/=L; }
  if(keys['q']) yaw+=dt*1.5;
  if(keys['e']) yaw-=dt*1.5;
  // Kamera yo'nalishiga nisbatan
  const fx=-Math.sin(yaw), fz=-Math.cos(yaw);
  const rx= Math.cos(yaw), rz=-Math.sin(yaw);
  const dx=rx*mx+fx*my, dz=rz*mx+fz*my;
  if(Math.hypot(dx,dz)>0.02){
    boy.root.rotation.y = Math.atan2(dx,dz);
    moveBoy(dx*4.2*dt, dz*4.2*dt);
    return true;
  }
  return false;
}

// ===== Stullarga o'tirish =====
let mode='walk';   // walk | sit | ride
let seated=null, ridingCab=null;
function nearestTable(){
  return TABLES.find(t=>Math.hypot(boy.root.position.x-t.x, boy.root.position.z-t.z)<2.8) || null;
}
const _v = new THREE.Vector3();
function lowestCab(){
  let best=null, by=1e9;
  cabs.forEach(c=>{ c.getWorldPosition(_v); if(_v.y<by){ by=_v.y; best=c; } });
  return {cab:best, y:by};
}
function nearGateCab(){
  const {cab,y} = lowestCab();
  if(y>6) return null;
  const bp = boy.root.getWorldPosition(new THREE.Vector3());
  const cp = cab.getWorldPosition(new THREE.Vector3());
  return Math.hypot(bp.x-cp.x, bp.z-cp.z)<4 ? cab : null;
}
function sitAt(t){
  mode='sit'; seated=t;
  const [A,B2]=t.seats;
  boy.root.position.set(A.x,-0.5,A.z);  boy.root.rotation.set(0,A.ry,0);
  girl.root.position.set(B2.x,-0.5,B2.z); girl.root.rotation.set(0,B2.ry,0);
}
function standUp(){
  mode='walk';
  const [A,B2]=seated.seats;
  boy.root.position.set(A.x-Math.sin(A.ry), 0, A.z-Math.cos(A.ry));
  boy.root.rotation.set(0,A.ry,0);
  girl.root.position.set(B2.x-Math.sin(B2.ry), 0, B2.z-Math.cos(B2.ry));
  girl.root.rotation.set(0,B2.ry,0);
  seated=null;
}
function boardCab(cab){
  mode='ride'; ridingCab=cab;
  cab.attach(boy.root); cab.attach(girl.root);
  boy.root.position.set(-0.3,-0.9,0);  boy.root.rotation.set(0,0,0);
  girl.root.position.set(0.3,-0.9,0);  girl.root.rotation.set(0,0,0);
}
function getOff(){
  mode='walk';
  scene.attach(boy.root); scene.attach(girl.root);
  boy.root.position.set(WX-3, 0, WZ+4);
  girl.root.position.set(WX-2, 0, WZ+4);
  boy.root.rotation.set(0,0,0); girl.root.rotation.set(0,0,0);
  ridingCab=null;
}

btn.addEventListener('click', ()=>{
  if(mode==='walk'){
    const t = nearestTable();
    if(t){ sitAt(t); return; }
    const cab = nearGateCab();
    if(cab){ boardCab(cab); return; }
  } else if(mode==='sit'){ standUp(); }
  else if(mode==='ride'){ getOff(); }
});

function updateButton(){
  if(mode==='walk'){
    const t = nearestTable();
    const cab = t ? null : nearGateCab();
    if(t){ btn.style.display='block'; btn.textContent = t.bench ? "Skameykaga o'tirish" : "Stulga o'tirish"; }
    else if(cab){ btn.style.display='block'; btn.textContent="Charxpalakka chiqish"; }
    else btn.style.display='none';
  } else {
    btn.style.display='block';
    btn.textContent = mode==='sit' ? 'Turish' : 'Tushish';
  }
}

// ===== Kamera =====
const camPos = new THREE.Vector3(4,3,10), camLook = new THREE.Vector3(4,1.5,2);
const tmp = new THREE.Vector3();
function updateCamera(){
  if(mode==='sit'){
    tmp.set(seated.cam[0],seated.cam[1],seated.cam[2]);
    camPos.lerp(tmp,0.08);
    tmp.set(seated.look[0],seated.look[1],seated.look[2]);
    camLook.lerp(tmp,0.08);
  } else {
    const target = boy.root.getWorldPosition(new THREE.Vector3());
    target.y += 1.5;
    const d = mode==='ride' ? 9 : 6.5;
    const want = new THREE.Vector3(
      target.x + Math.sin(yaw)*Math.cos(pitch)*d,
      target.y + Math.sin(pitch)*d,
      target.z + Math.cos(yaw)*Math.cos(pitch)*d
    );
    camPos.lerp(want,0.2);
    camLook.lerp(target,0.3);
  }
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// ===== Tsikl =====
const clock=new THREE.Clock();
let time=0;
function frame(){
  const dt=Math.min(clock.getDelta(),0.05);
  time+=dt;

  wheel.rotation.z -= dt*0.1;
  cabs.forEach(c=>c.rotation.z = -wheel.rotation.z);   // kabinalar tik turadi

  birds.forEach((b,i)=>{
    const a = time*0.25 + i*0.7;
    b.g.position.set(Math.cos(a)*b.r, b.h+Math.sin(time*1.3+i)*1.5, Math.sin(a)*b.r);
    b.g.rotation.y = -a;
    b.wl.rotation.z =  Math.sin(time*9+i)*0.7;
    b.wr.rotation.z = -Math.sin(time*9+i)*0.7;
  });

  let moving=false;
  if(mode==='walk') moving = walk(dt);
  const sitting = mode!=='walk';
  pose(boy,  time, moving, sitting);
  pose(girl, time, false,  sitting);

  updateCamera();
  updateButton();
  renderer.render(scene,camera);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
